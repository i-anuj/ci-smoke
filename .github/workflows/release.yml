name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy-int:
    if: github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: int
      run-id: ${{ github.event.workflow_run.id }}
    secrets: inherit

  deploy-uat:
    needs: deploy-int
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: uat
      run-id: ${{ github.event.workflow_run.id }}
    secrets: inherit

  deploy-prd:
    needs: deploy-uat
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: prd
      run-id: ${{ github.event.workflow_run.id }}
    secrets: inherit
